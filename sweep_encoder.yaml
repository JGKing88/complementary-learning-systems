program: run_sweep.py
method: bayes
metric:
  name: val_nav/accuracy
  goal: maximize
parameters:
  cka_topk:
    values: [5, 10, 20, 40, 80]
  mod_loss_lambda:
    values: [0.5, 1.0, 2.0, 3.0, 4.0]
  out_dim:
    values: [64, 128, 256]
  hidden_dim:
    values: [256, 512]
  hidden_channels:
    values: [64, 128]
  num_layers:
    values: [2, 3, 4]
  kernel_size:
    values: [3, 5]
  num_hidden_layers:
    values: [2, 3]
  lr:
    distribution: log_uniform_values
    min: 0.00003
    max: 0.001
  batch_size:
    values: [4096, 8192]
  gain_end:
    values: [3, 5, 7, 10]
  uniformity_lambda_end:
    distribution: log_uniform_values
    min: 0.01
    max: 1.0
  Npos:
    values: [50]
  Nenv:
    values: [100]
