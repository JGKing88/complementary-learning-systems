/* ---- one metric definition, used for every run, so the cards cannot drift ---- */
const last=a=>a[a.length-1];
function derive(r){
  const ex=r.task==='exploit';
  const primary=ex?r.s0:r.cov.map(v=>v*2);
  const thresh=ex?0.85:0.70;
  let bi=primary.findIndex(v=>v>=thresh);
  const minAfter=bi<0?null:Math.min(...primary.slice(bi+1));
  return {
    ex, primary, thresh,
    breakthrough: bi<0?null:r.U[bi],
    minAfter,
    headline:   ex?last(r.s0):last(primary),
    headline10: ex?last(r.s10):last(r.cov10)*2,
    second:   ex?last(r.s10):last(r.cov),
    third:    ex?last(r.t0):last(r.uni),
    speed:    ex?last(r.v0):last(r.mu),
  };
}

  const x0=xs[0],x1=last(xs);
  const px=u=>M.l+(u-x0)/(x1-x0)*(W-M.l-M.r);
  const py=v=>M.t+(1-(v-o.yMin)/(o.yMax-o.yMin))*(H-M.t-M.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||'training curve'}">`;
  if(o.band)s+=`<rect x="${px(x0)}" y="${M.t}" width="${px(o.band)-px(x0)}" height="${H-M.t-M.b}" fill="var(--band)"/>`+
              `<rect x="${px(o.band)}" y="${M.t}" width="${px(x1)-px(o.band)}" height="${H-M.t-M.b}" fill="var(--band2)"/>`;
  for(const t of o.ticks){
    s+=`<line x1="${M.l}" y1="${py(t)}" x2="${W-M.r}" y2="${py(t)}" stroke="var(--rule-soft)"/>`+
       `<text x="${M.l-10}" y="${py(t)+4}" text-anchor="end" font-family="IBM Plex Mono" font-size="11" fill="var(--muted)">${o.fmt(t)}</text>`;}
  for(const r of (o.refs||[])){
    s+=`<line x1="${M.l}" y1="${py(r.v)}" x2="${W-M.r}" y2="${py(r.v)}" stroke="var(--floor)" stroke-width="1.4" stroke-dasharray="5 4"/>`+
       `<text x="${W-M.r-4}" y="${py(r.v)-6}" text-anchor="end" font-family="IBM Plex Mono" font-size="10.5" fill="var(--muted)">${r.l}</text>`;}
  const gs=(x1-x0)>1000?500:250;
  for(let u=x0+gs-x0%gs;u<=x1;u+=gs){
    s+=`<line x1="${px(u)}" y1="${M.t}" x2="${px(u)}" y2="${H-M.b}" stroke="var(--rule-soft)"/>`+
       `<text x="${px(u)}" y="${H-M.b+20}" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="var(--muted)">u${u}</text>`;}
  s+=`<line x1="${M.l}" y1="${H-M.b}" x2="${W-M.r}" y2="${H-M.b}" stroke="var(--rule)"/>`;
  for(const se of series){
    const X=se.x||xs;
    s+=`<path d="${se.d.map((v,i)=>`${i?'L':'M'}${px(X[i]).toFixed(1)},${py(v).toFixed(1)}`).join('')}" fill="none" stroke="var(--${se.c})" stroke-width="${se.w||2}" stroke-linejoin="round" stroke-linecap="round" opacity="${se.w?.72:1}"/>`;
    s+=`<circle cx="${px(last(X))}" cy="${py(last(se.d))}" r="3.4" fill="var(--${se.c})"/>`;}
  return s+'</svg>';
}
const box=(inner,leg)=>`<div class="chart">${inner}</div><div class="legend">${leg}</div>`;
const key=(c,t)=>`<span><i style="background:var(--${c})"></i>${t}</span>`;
const dashKey=t=>`<span><i class="dash"></i>${t}</span>`;

/* ---- views ---- */
function cfgChips(c){
  return `<div class="cfg">
    <span class="chip"><b>speed</b> ${c.speed}</span>
    <span class="chip${c.cur?' on':''}"><b>curriculum</b> ${c.cur?c.cur:'none — U[0,10] from update 1'}</span>
    <span class="chip${c.tp!=='0.05'?' on':''}"><b>time_penalty</b> ${c.tp}</span>
    <span class="chip"><b>schedule</b> ${c.sch}</span>
  </div>`;
}
function statRow(r,d){
  const c=[
    {k:d.ex?'Success · 0 dist':'Cells / step',v:F(d.headline),n:d.ex?'96 of 96 = 1.000':'billiard ref 0.775',hi:1},
    {k:d.ex?'Success · 10 dist':'Coverage',v:F(d.second),n:d.ex?'of 96 trials':'per rollout'},
    {k:d.ex?'Mean steps':'Union coverage',v:d.ex?d.third.toFixed(2):F(d.third),n:d.ex?'floor 9.95':'across trials'},
    {k:'Final speed',v:d.speed.toFixed(2),n:r.cfg.speed.startsWith('frozen')?'fixed by config':'chosen'},
    {k:`First ≥${d.thresh}`,v:'u'+d.breakthrough,n:'then min '+F(d.minAfter),hi:1},
  ];
  if(d.ex)c[0].n=(d.headline===1?'96 of 96':'')+' — perfect';
  return `<div class="stats">${c.map(s=>
    `<div class="stat${s.hi?' hi':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div><div class="n">${s.n}</div></div>`).join('')}</div>`;
}
function charts(r,d){
  if(d.ex){
    return `
    <section><h2>Outcome — success rate</h2><p class="sub">Both distractor levels. Shaded to the left of the update where it first holds a ceiling.</p>
      ${box(svg(r.U,[{d:r.s10,c:'b'},{d:r.s0,c:'a'}],{yMin:0,yMax:1.04,ticks:[0,.25,.5,.75,1],fmt:v=>v.toFixed(2),band:d.breakthrough,label:'success rate'}),
        key('a','0 distractors')+key('b','10 distractors'))}</section>
    <section><h2>Efficiency — mean steps to goal</h2><p class="sub">Over successful trials only, so early points drawn from a handful of lucky starts mean little.</p>
      ${box(svg(r.U,[{d:r.t0,c:'a'}],{yMin:0,yMax:Math.max(...r.t0)*1.05,ticks:[0,20,40,60],fmt:v=>v,refs:[{v:9.95,l:'optimal 9.95'}],band:d.breakthrough,label:'mean steps'}),
        key('a','mean steps')+dashKey('optimal path at speed 1.0'))}</section>
    <section><h2>Realized step magnitude</h2><p class="sub">Distance actually covered per step after the arena clip. Below the commanded value wherever the agent is pressing into a wall.</p>
      ${box(svg(r.U,[{d:r.v0,c:'a'}],{yMin:0.2,yMax:Math.max(1.06,Math.max(...r.v0)*1.05),ticks:[.25,.5,.75,1,1.25,1.5].filter(t=>t<=Math.max(1.06,Math.max(...r.v0)*1.05)),fmt:v=>v.toFixed(2),refs:[{v:1,l:'1.0'}],label:'step magnitude'}),
        key('a','realized ‖a‖')+dashKey('one cell'))}</section>`;
  }
  const cps=r.cov.map(v=>v*2);
  return `
  <section><h2>Outcome — cells per step</h2><p class="sub">Against the strategy ladder: a uniform random walk manages 0.36 here, a billiard 0.775, a lawnmower sweep 0.955.</p>
    ${box(svg(r.U,[{d:cps,c:'a'}],{yMin:0,yMax:1.02,ticks:[0,.25,.5,.75,1],fmt:v=>v.toFixed(2),refs:[{v:.36,l:'random walk'},{v:.775,l:'billiard'},{v:.955,l:'lawnmower'}],band:d.breakthrough,label:'cells per step'}),
      key('a','cells / step')+dashKey('strategy ladder'))}</section>
  <section><h2>Efficiency — union coverage</h2><p class="sub">Share of the arena reached across all trials in an environment, as opposed to within one rollout.</p>
    ${box(svg(r.U,[{d:r.uni,c:'b'}],{yMin:.3,yMax:1.02,ticks:[.4,.6,.8,1],fmt:v=>v.toFixed(2),band:d.breakthrough,label:'union coverage'}),
      key('b','union coverage'))}</section>
  <section><h2>Commanded step magnitude</h2><p class="sub">What the policy asks for, against its permitted ceiling of 2.0.</p>
    ${box(svg(r.muX,[{d:r.mu,c:'a',x:r.muX}],{yMin:.8,yMax:2.08,ticks:[1,1.5,2],fmt:v=>v.toFixed(2),refs:[{v:2,l:'cap 2.0'}],label:'commanded magnitude'}),
      key('a','commanded ‖a‖')+dashKey('permitted maximum'))}</section>`;
}

function compareTable(hereId){
  const rows=RUNS.map(r=>{const d=derive(r);
    return `<tr class="${r.id===hereId?'me':''}"><td><a href="#${r.id}">${r.name}</a></td>
      <td>${r.cfg.speed.replace('learned ','').replace('frozen ','')}</td><td>${r.cfg.cur?'yes':'—'}</td><td>${r.cfg.tp}</td>
      <td>${F(d.headline)}</td><td>${F(d.headline10)}</td><td>${d.speed.toFixed(2)}</td>
      <td>${d.ex?d.third.toFixed(2):F(d.third)}</td>
      <td>u${d.breakthrough}</td><td>${F(d.minAfter)}</td></tr>`;}).join('');
  return `<div class="tw"><table>
    <thead><tr><th>Run</th><th>Speed cfg</th><th>Curric.</th><th>t_pen</th>
      <th>@ 0 dist</th><th>@ 10 dist</th><th>Final ‖a‖</th><th>Steps / union</th><th>First good</th><th>Min after</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function home(){
  return `
  <header>
    <p class="eyebrow">hopfield_nav · phase 2 · polar action head</p>
    <h1>Polar Navigation Runs</h1>
    <p class="standfirst">Nine training runs of a policy whose heading and speed are drawn from separate distributions. Four establish the parameterization, three ask why convergence takes 550 updates, and two isolate what freedom over step size is actually worth.</p>
  </header>

  <section><h2>All nine at a glance</h2>
    <p class="sub">Headline is success rate for exploit runs and cells-per-step for explore, reported at both zero and ten distractors. “Final ‖a‖” is the realized step magnitude — what the policy actually moved, after the arena clip. “First good” is the update at which the zero-distractor headline first reaches 0.85 (exploit) or 0.70 (explore); “min after” is the lowest it falls thereafter, which is the stability measure.</p>
    ${compareTable(null)}</section>

  <section><h2>The runs</h2><div class="cards">
    ${RUNS.map(r=>{const d=derive(r);return `<a class="card" href="#${r.id}">
      <span class="fam">${r.fam}</span>
      <h3>${r.name}</h3>
      <div class="hd3">
        <div><b>${F(d.headline)}</b><span>${d.ex?'succ · 0d':'cps · 0d'}</span></div>
        <div class="dim"><b>${F(d.headline10)}</b><span>${d.ex?'succ · 10d':'cps · 10d'}</span></div>
        <div class="dim"><b>${d.speed.toFixed(2)}</b><span>speed</span></div>
      </div>
      <p>${r.blurb}</p>
      ${cfgChips(r.cfg)}
    </a>`;}).join('')}
  </div></section>

  <section>
    <p class="note"><b>What the set establishes.</b> Polar closed the magnitude channel the Cartesian head left open — speed modulation across distractor levels fell from 1.234× to 1.003× — and with it closed, directional noise picks up the near-goal state-dependence that σ never showed. The best exploit model reaches every goal in 10.95 steps against a 9.95 floor.</p>
    <p class="note"><b>What it deflates.</b> Step count tracks the speed <em>cap</em>, not the freedom: capped at 1.0 the policy takes 11.79 steps against the pinned arm's 10.95. And none of the three shaping knobs changes where a run ends up — all four P11 arms finish within 10.95–12.09 steps. They change only how turbulently it gets there.</p>
    <p class="note"><b>Read on the recorded split.</b> Every number here comes from each run's own six validation environments — never trained on, but the set it was scored against at every eval, not a fresh draw.</p>
  </section>

  <footer>Polar action head: heading from a von&nbsp;Mises over the allocentric angle, speed from a Beta over the permitted band, or deleted outright when frozen. All runs seed 42, evaluated every 50 updates on 96 trials. Full record in <code>docs/EXPERIMENTS_NAV_P2.md</code> §9.4–9.9.</footer>`;
}

function detail(r){
  const d=derive(r);
  return `
  <a class="back" href="#">← all runs</a>
  <header>
    <p class="eyebrow">${r.fam} · run ${r.job}</p>
    <h1>${r.name}</h1>
    <p class="standfirst">${r.blurb}</p>
    <div style="margin-top:1.3rem">${cfgChips(r.cfg)}</div>
  </header>
  ${statRow(r,d)}
  ${charts(r,d)}
  <section><h2>Against the other eight</h2>
    <p class="sub">This run highlighted. Same columns and same definitions for every run in the set.</p>
    ${compareTable(r.id)}</section>
  <footer>Measured on the recorded split — the run's own six validation environments, not a fresh draw. Full record in <code>docs/EXPERIMENTS_NAV_P2.md</code> §9.4–9.9.</footer>`;
}

function render(){
  const id=location.hash.replace('#','');
  const r=RUNS.find(x=>x.id===id);
  document.getElementById('app').innerHTML=r?detail(r):home();
  window.scrollTo(0,0);
}
addEventListener('hashchange',render);
render();
</script>
