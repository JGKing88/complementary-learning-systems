[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cls"
version = "0.1.0"
description = "Hopfield-memory navigation: grid-code encoder, scaffold, policy, evaluation."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Project Authors" }]
license = { text = "MIT" }

[project.optional-dependencies]
viz = [
  "numpy>=1.20",
  "matplotlib>=3.4",
]
train = [
  "torch>=2.0",
  "numpy>=1.20",
]

[tool.setuptools]
include-package-data = true

# All five live packages, in layer order. Until phase 7 this said
# `include = ["cls*"]` and nothing else was installed -- the others worked only
# because every entry point runs as `python -m ...` from the repo root, which is
# why every sbatch script starts with `cd /home/jackking/cls`. `cls` itself is
# gone (tag `legacy-cls`); the project name is kept because the repo directory,
# the conda env and 309 checkpoint paths are all called that.
[tool.setuptools.packages.find]
where = ["."]
include = [
  "gridcode*",
  "hopfield*",
  "encoder_training*",
  "hopfield_nav*",
  "analysis*",
]
exclude = ["docs*", "scripts*"]

# `requires-python` is >=3.9 rather than the old >=3.8: the source uses PEP 604
# unions (`int | None`) at runtime in dataclass fields, which 3.8 cannot parse.
# The environment is 3.13.

[tool.pytest.ini_options]
# The live suite. The root tests/ directory was deleted in phase 7 together
# with the `cls` package it exercised; it had not collected since a top-level
# train.py disappeared some time before 2026-08.
testpaths = ["hopfield_nav/tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than a few seconds; deselect with -m 'not slow'",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
